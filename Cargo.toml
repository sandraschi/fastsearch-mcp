[workspace]
members = [
    "shared"
]
resolver = "2"

[workspace.dependencies]
# Common dependencies for shared types only
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"

[workspace.package]
version = "0.4.0"
authors = ["FastSearch Team"]
license = "MIT"
edition = "2021"
description = "FastSearch MCP - Shared types for Python/C++ communication"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
