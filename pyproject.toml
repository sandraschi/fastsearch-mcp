[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsearch-mcp"
version = "0.4.0"
description = "FastSearch MCP Server - FastMCP 3.1 compliant NTFS search service"
authors = [
    {name = "sandraschi", email = "team@sandraschi.dev"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=3.1.0,<4",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "httpx>=0.27.0",
    "ruff>=0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
fastsearch-mcp = "fastsearch_mcp.__main__:cli_main"
fastsearch-gateway = "fastsearch_mcp.gateway:main"

[project.urls]
Homepage = "https://github.com/fastsearch/fastsearch-mcp"
Documentation = "https://github.com/fastsearch/fastsearch-mcp/blob/main/README.md"
Repository = "https://github.com/fastsearch/fastsearch-mcp"
Issues = "https://github.com/fastsearch/fastsearch-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# Black and isort replaced by ruff (see [tool.ruff] section below)

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = ["build", "dist", ".eggs", ".git", ".hg", ".mypy_cache", ".tox", ".venv", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# FastMCP 2.13 pattern: imports after mcp instance creation and side-effect imports
"src/fastsearch_mcp/server.py" = ["E402", "F401"]  # E402: imports after mcp instance, F401: side-effect imports
"src/fastsearch_mcp/tools/__init__.py" = ["F401"]  # F401: imports for side effects (tool registration)
"src/fastsearch_mcp/__main__.py" = ["E402"]  # E402: imports after sys.path manipulation
# Test files often have complex setup/teardown logic
"test_*.py" = ["C901", "E402"]  # E402: imports after sys.path manipulation are necessary
"*_test.py" = ["C901", "E402"]
"tests/**/*.py" = ["C901", "E402"]
# Source files with legitimate complexity (service status, file search, etc.)
"src/fastsearch_mcp/mcp_server.py" = ["C901"]  # get_status handles multiple service states
"src/fastsearch_mcp/tools/file_search.py" = ["C901"]  # _search_sync handles complex file filtering
"src/fastsearch_mcp/tools/integrity_checker.py" = ["C901"]  # Complex file integrity checking logic
"src/fastsearch_mcp/tools/service_manager.py" = ["C901"]  # Windows service management complexity
"src/fastsearch_mcp/utils/file_utils.py" = ["C901"]  # Complex file finding logic

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=fastsearch_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
  markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "service: marks tests that require the FastSearch service",
    "admin: marks tests that require administrator privileges",
  ]
