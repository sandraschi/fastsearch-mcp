name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'manifest.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'manifest.json'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    
    - name: Run ruff linting
      run: |
        ruff check src/ tests/
    
    - name: Run ruff formatting check
      run: |
        ruff format --check src/ tests/
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v
    
    - name: Generate documentation
      run: |
        python scripts/generate_docs.py
    
    - name: Validate MCPB package
      run: |
        npm install -g @anthropic-ai/mcpb
        mcpb validate

  package:
    needs: test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install MCPB
      run: npm install -g @anthropic-ai/mcpb
    
    - name: Package MCPB
      run: mcpb pack
      
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: fastsearch-mcp.mcpb
        path: dist/*.mcpb
        if-no-files-found: error
