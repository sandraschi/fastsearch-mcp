name: Build FastSearch MCP - Dual Package Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  # Build matrix for dual package strategy: MSI + MCPB
  build-packages:
    name: Build ${{ matrix.package_type }} - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSI Package (Windows service - C++ CMake build)
          - package_type: msi
            platform: windows-x64
            os: windows-latest
            output: fastsearch-mcp-setup.msi
            
          # MCPB Package (Windows)
          - package_type: mcpb
            platform: windows-x64
            os: windows-latest
            output: fastsearch-mcp.mcpb
            
          # MCPB Package (Linux) - Cross-platform MCP support (Python bridge only, no service)
          - package_type: mcpb
            platform: linux-x64
            os: ubuntu-latest
            output: fastsearch-mcp-linux.mcpb
            
          # MCPB Package (macOS) - Cross-platform MCP support (Python bridge only, no service)
          - package_type: mcpb
            platform: macos-x64
            os: macos-latest
            output: fastsearch-mcp-macos.mcpb

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for git describe version detection

    - name: Get version from tag
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -like "refs/tags/*") {
          $version = $env:GITHUB_REF -replace "refs/tags/", ""
        } else {
          $version = git describe --tags --always --dirty
        }
        Write-Host "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "Building version: $version"

    - name: Setup Visual Studio (MSI only)
      if: matrix.package_type == 'msi'
      uses: microsoft/setup-msbuild@v2

    - name: Setup CMake (MSI only)
      if: matrix.package_type == 'msi'
      uses: microsoft/setup-cmake@v2
      with:
        cmake-version: '3.20'

    - name: Setup Node.js (MCPB only)
      if: matrix.package_type == 'mcpb'
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Python (MCPB only)
      if: matrix.package_type == 'mcpb'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup WiX Toolset (MSI only - required for CPack)
      if: matrix.package_type == 'msi'
      shell: pwsh
      run: |
        # Install WiX toolset v5 (CPack uses WiX for MSI generation)
        dotnet tool install --global wix --version 5.*
        $wixPath = "$env:USERPROFILE\.dotnet\tools"
        Write-Host "WIX=$wixPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "$wixPath" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        
    - name: Setup MCPB CLI (MCPB only)
      if: matrix.package_type == 'mcpb'
      run: |
        npm install -g @anthropic-ai/mcpb

    - name: Build C++ Service (MSI only)
      if: matrix.package_type == 'msi'
      shell: pwsh
      run: |
        Write-Host "Building C++ service with CMake..." -ForegroundColor Cyan
        cd service
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64
        cmake --build build --config Release
        
        # Verify binary exists
        $serviceBinary = "build\bin\Release\FastSearchServiceNew.exe"
        if (-not (Test-Path $serviceBinary)) {
          Write-Host "❌ Service binary not found: $serviceBinary" -ForegroundColor Red
          exit 1
        }
        Write-Host "✅ Service binary found: $serviceBinary" -ForegroundColor Green
        Get-Item $serviceBinary | Format-List

    - name: Create MSI Package with CPack
      if: matrix.package_type == 'msi'
      shell: pwsh
      run: |
        Write-Host "Creating MSI package with CPack..." -ForegroundColor Cyan
        
        # Get version from tag
        $version = $env:GITHUB_REF -replace "refs/tags/v", ""
        Write-Host "Building version: $version" -ForegroundColor Yellow
        
        # Reconfigure CMake with version and build package
        cd service
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
          -DCPACK_PACKAGE_VERSION="$version" `
          -DCMAKE_PROJECT_VERSION="$version"
        
        # Build and package with CPack
        cmake --build build --config Release --target package
        
        # Find the created MSI (CPack puts it in build/_CPack_Packages or build/)
        $msiFile = Get-ChildItem -Path "build" -Filter "*.msi" -Recurse | Select-Object -First 1
        if ($msiFile) {
          $outputPath = Join-Path (Get-Location) "..\${{ matrix.output }}"
          Copy-Item -Path $msiFile.FullName -Destination $outputPath -Force
          Write-Host "✅ MSI package created: $outputPath" -ForegroundColor Green
          Get-Item $outputPath | Format-List
        } else {
          Write-Host "❌ MSI package not found in build directory" -ForegroundColor Red
          Write-Host "Searching in build directory:" -ForegroundColor Yellow
          Get-ChildItem -Path "build" -Recurse | Select-Object FullName
          exit 1
        }

    - name: Create MCPB Package (Windows)
      if: matrix.package_type == 'mcpb' && matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Write-Host "Creating MCPB package..." -ForegroundColor Cyan
        .\scripts\build-mcpb-package.ps1
        
        # Find the created MCPB and rename to expected output name
        $mcpbFile = Get-ChildItem -Path "dist" -Filter "*.mcpb" | Select-Object -First 1
        if ($mcpbFile) {
          $outputPath = Join-Path (Get-Location) "${{ matrix.output }}"
          Move-Item -Path $mcpbFile.FullName -Destination $outputPath -Force
          Write-Host "✅ MCPB package created: $outputPath" -ForegroundColor Green
        } else {
          Write-Host "❌ MCPB package not found in dist directory" -ForegroundColor Red
          exit 1
        }

    - name: Create MCPB Package (Linux/macOS)
      if: matrix.package_type == 'mcpb' && matrix.os != 'windows-latest'
      shell: bash
      run: |
        echo "Creating MCPB package for ${{ matrix.platform }}..." 
        
        # Install MCPB CLI if not already installed
        npm install -g @anthropic-ai/mcpb
        
        # Create build directory
        mkdir -p mcpb-build/src
        mkdir -p mcpb-build/prompts
        
        # Copy source code
        cp -r src/fastsearch_mcp mcpb-build/src/
        cp manifest.json mcpb-build/
        cp -r prompts/* mcpb-build/prompts/
        
        # Create requirements.txt
        cat > mcpb-build/requirements.txt << EOF
        fastmcp>=3.2.0,<4
        pydantic>=2.0.0
        psutil>=5.9.0
        EOF
        
        # Validate manifest
        cd mcpb-build
        mcpb validate manifest.json
        
        # Build package
        mcpb pack . "../${{ matrix.output }}"
        
        cd ..
        if [ -f "${{ matrix.output }}" ]; then
          echo "✅ MCPB package created: ${{ matrix.output }}"
          ls -lh "${{ matrix.output }}"
        else
          echo "❌ MCPB package not found"
          exit 1
        fi

    - name: Upload package artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.package_type }}-${{ matrix.platform }}
        path: ${{ matrix.output }}
        retention-days: 30

  # Create GitHub release if this is a tag push
  create-release:
    name: Create GitHub Release
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all package artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release-files
        
        # Copy all package files to release directory
        find artifacts -name "*.msi" -o -name "*.mcpb" | while read file; do
          cp "$file" release-files/
        done
        
        echo "Release files prepared:"
        ls -la release-files/
        
        # Generate checksums
        cd release-files
        sha256sum * > CHECKSUMS.sha256
        cd ..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-files/*
        draft: false
        prerelease: false
        body: |
          ## FastSearch MCP Release ${{ github.ref_name }}
          
          **DUAL PACKAGE INSTALLATION - BOTH REQUIRED FOR FULL FUNCTIONALITY:**
          
          ### 1. Windows Service Installation (Required)
          Download and install: `fastsearch-mcp-setup.msi`
          - Requires Administrator privileges (UAC prompt)
          - Installs Windows service for NTFS MFT indexing
          - Service runs automatically on startup
          
          ### 2. Claude Desktop Extension (Required)  
          Download and install: `fastsearch-mcp.mcpb`
          - Install via Claude Desktop Extensions panel
          - Provides rich tool integration with parameter validation
          - Connects to Windows service via named pipe
          
          ### Cross-Platform MCPB Extensions
          - `fastsearch-mcp-linux.mcpb` - Limited functionality (no NTFS service)
          - `fastsearch-mcp-macos.mcpb` - Limited functionality (no NTFS service)
          
          ### Installation Order
          1. **First**: Install MSI (Windows service with elevated privileges)
          2. **Second**: Install MCPB (Claude Desktop extension)
          3. **Verify**: Check that both service and extension are running
          
          ### Features
          - Lightning-fast semantic search across all files
          - NTFS MFT direct reading for maximum performance  
          - Rich Claude Desktop integration with self-documenting tools
          - Cross-platform MCP bridge support
          
          ### Requirements
          - Windows 10/11 (x64) for full functionality
          - Claude Desktop 0.10.0+ with MCP support
          - Administrator privileges for service installation
          
          ### Support
          - Documentation: [GitHub Repository](https://github.com/sandraschi/fastsearch-mcp)
          - Issues: [GitHub Issues](https://github.com/sandraschi/fastsearch-mcp/issues)
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
